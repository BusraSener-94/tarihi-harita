<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türkiye Arkeolojik Miras ve Kadim Kültür Atlası (3D WebGL)</title>

  <!-- MapLibre GL JS v4 & CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Google Fonts: Cinzel & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111b24; /* Antik deniz / derin su rengi */
      color: #e6dfd5;
    }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Antik Parşömen & Bronz HUD Kontrol Paneli */
    .antique-hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      width: 360px;
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      background: rgba(20, 16, 12, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(184, 134, 11, 0.15);
      scrollbar-width: thin;
      scrollbar-color: #8b6508 #16110c;
    }

    .brand-header {
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.2px;
      background: linear-gradient(135deg, #ffd700, #d4af37, #cd7f32);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #a89a85;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .stat-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(139, 101, 8, 0.18);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
    }
    .stat-label { font-size: 11px; text-transform: uppercase; color: #a89a85; font-weight: 600; letter-spacing: 0.5px; }
    .stat-value { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; color: #ffd700; }

    /* Arama Çubuğu */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }
    .search-input {
      width: 100%;
      background: rgba(10, 8, 5, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      padding: 9px 12px 9px 34px;
      color: #f5eedf;
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: #d4af37;
      pointer-events: none;
    }

    /* Filtre Grupları */
    .filter-group { margin-bottom: 10px; }
    .filter-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #c4b59d;
      margin-bottom: 4px;
    }
    .antique-select {
      width: 100%;
      background: rgba(10, 8, 5, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 8px 10px;
      color: #e6dfd5;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .antique-select:focus { border-color: #ffd700; }

    /* 3B Uçuş Lokasyonları (Fly-To Presets) */
    .preset-title {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #c4b59d;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-preset {
      background: rgba(30, 22, 14, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 7px 6px;
      color: #f5eedf;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-preset:hover {
      background: rgba(184, 134, 11, 0.35);
      border-color: #ffd700;
      transform: translateY(-1px);
    }

    /* 3B Arazi ve Kamera Kontrolleri */
    .terrain-control-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    .btn-toggle-3d {
      flex: 1;
      padding: 8px;
      background: linear-gradient(135deg, #8b6508, #5c4305);
      border: 1px solid #ffd700;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-toggle-3d:hover {
      background: linear-gradient(135deg, #b8860b, #7a5806);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    /* Lejant */
    .legend-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; border: 1px solid #fff; }

    /* MapLibre Pop-up Özel Tasarım (Antik Parşömen Kartı) */
    .maplibregl-popup-content {
      background: rgba(18, 14, 10, 0.95) !important;
      border: 1px solid #d4af37 !important;
      border-radius: 10px !important;
      color: #f5eedf !important;
      padding: 16px !important;
      max-width: 330px !important;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(184, 134, 11, 0.15) !important;
    }
    .maplibregl-popup-tip { border-top-color: #d4af37 !important; }
    .maplibregl-popup-close-button {
      color: #d4af37 !important;
      font-size: 16px !important;
      padding: 4px 8px !important;
    }
    .maplibregl-popup-close-button:hover { color: #fff !important; }

    .popup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #ffd700;
      margin-bottom: 8px;
    }
    .popup-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.3;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      padding-bottom: 6px;
    }
    .popup-row {
      display: flex;
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .popup-row b {
      color: #d4af37;
      width: 85px;
      flex-shrink: 0;
    }
    .popup-row span { color: #e6dfd5; word-break: break-word; }

    /* Yükleme Ekranı Spinner */
    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0f0c08;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    .antique-spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top: 3px solid #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .loading-text {
      font-family: 'Cinzel', serif;
      color: #ffd700;
      font-size: 14px;
      letter-spacing: 1.5px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Yükleme Ekranı -->
  <div id="loading-screen">
    <div class="antique-spinner"></div>
    <div class="loading-text" id="loading-status">ANADOLU 3D ARKEOLOJİK ATLASI YÜKLENİYOR...</div>
  </div>

  <!-- HUD Kontrol Paneli -->
  <div class="antique-hud">
    <div class="brand-header">
      <div class="brand-title">🏛️ Antik Atlas 3D</div>
      <div class="brand-subtitle">Türkiye & İstanbul Arkeolojik Miras Coğrafyası</div>
    </div>

    <div class="stat-ribbon">
      <span class="stat-label">Tescilli Kültür Mirası</span>
      <span class="stat-value" id="total-heritage-count">12.046</span>
    </div>

    <!-- Arama -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="site-search" class="search-input" placeholder="Antik kent, höyük, kale veya ilçe ara..." autocomplete="off">
    </div>

    <!-- Kartografik Altlık Seçici (Basemap Switcher) -->
    <div class="filter-group">
      <label class="filter-label">Kartografik Altlık Stili</label>
      <select id="basemap-style-select" class="antique-select">
        <option value="PARCHMENT_TOPO">📜 Antik Parşömen & Topoğrafya (Önerilen)</option>
        <option value="OPENTOPO">🏔️ OpenTopo Rölyef & Nehirler</option>
        <option value="IMAGERY_3D">🛰️ 3B Uydu & Doğal Peyzaj</option>
        <option value="DARK_MATTER">🌒 Karanlık İmparatorluk (Dark Matter)</option>
      </select>
    </div>

    <!-- Dönem Filtresi -->
    <div class="filter-group">
      <label class="filter-label">Kronolojik Dönem</label>
      <select id="period-filter" class="antique-select">
        <option value="ALL">Tüm Çağlar ve Dönemler</option>
        <option value="NEOLITHIC">Neolitik / Kalkolitik (MÖ 10.000 - MÖ 3000)</option>
        <option value="BRONZE_HITTITE">Tunç Çağı / Hitit / Asur (MÖ 3000 - MÖ 1200)</option>
        <option value="IRON_CLASSIC">Demir Çağı / Frig / Lidya / Urartu</option>
        <option value="HELLENISTIC_ROMAN">Klasik / Helenistik / Roma İmparatorluğu</option>
        <option value="BYZANTINE">Doğu Roma (Bizans Dönemi)</option>
        <option value="SELJUK">Selçuklu & Anadolu Beylikleri</option>
        <option value="OTTOMAN">Osmanlı İmparatorluğu</option>
      </select>
    </div>

    <!-- Kategori Filtresi -->
    <div class="filter-group">
      <label class="filter-label">Tipolojik Sınıflandırma</label>
      <select id="category-filter" class="antique-select">
        <option value="ALL">Tüm Tipolojiler</option>
        <option value="Antik Kent / Ören Yeri">Antik Kentler & Ören Yerleri</option>
        <option value="Höyük / Tümülüs">Höyükler & Tümülüsler</option>
        <option value="Kale / Hisar / Tahkimat">Kaleler, Hisarlar & Tabyalar</option>
        <option value="Kaya Mezarı / Lahit / Tümülüs">Kaya Mezarları & Lahitler</option>
        <option value="Antik Sarnıç">Antik Sarnıçlar & Su Yapıları</option>
        <option value="Tarihi Su Kemeri">Tarihi Su Kemerleri (Aqueducts)</option>
        <option value="Harabe / Antik Kalıntı">Tarihi Harabeler & Kalıntılar</option>
      </select>
    </div>

    <!-- 3B Sinematik Uçuş Konumları -->
    <div class="preset-title">3 Boyutlu Sinematik Keşif</div>
    <div class="preset-grid">
      <button class="btn-preset" onclick="flyToPreset('NEMRUT')">🏔️ Nemrut Dağı</button>
      <button class="btn-preset" onclick="flyToPreset('KAPADOKYA')">🌄 Kapadokya</button>
      <button class="btn-preset" onclick="flyToPreset('ISTANBUL')">🏰 Boğaziçi & Haliç</button>
      <button class="btn-preset" onclick="flyToPreset('EFES')">🏛️ Efes & İyonya</button>
      <button class="btn-preset" onclick="flyToPreset('LİKYA')">🌊 Likya Kanyonu</button>
      <button class="btn-preset" onclick="flyToPreset('GOBEKLITEPE')">☀️ Göbekli Tepe</button>
    </div>

    <!-- 3D Arazi ve Kamera Kontrolü -->
    <div class="terrain-control-bar">
      <button class="btn-toggle-3d" id="btn-pitch-toggle" onclick="toggle3DPerspective()">3B Eğim Modu [Açık]</button>
      <button class="btn-toggle-3d" style="background:#2b1f13;" onclick="resetCamera()">Genel Bakış</button>
    </div>

    <!-- Renk Lejandı -->
    <div class="legend-box">
      <div class="legend-item"><span class="legend-dot" style="background: #2ecc71;"></span> Neolitik & Kalkolitik</div>
      <div class="legend-item"><span class="legend-dot" style="background: #e67e22;"></span> Hitit & Tunç / Demir Çağı</div>
      <div class="legend-item"><span class="legend-dot" style="background: #00e5ff;"></span> Klasik & Helenistik</div>
      <div class="legend-item"><span class="legend-dot" style="background: #f1c40f;"></span> Roma İmparatorluğu</div>
      <div class="legend-item"><span class="legend-dot" style="background: #9b59b6;"></span> Doğu Roma (Bizans)</div>
      <div class="legend-item"><span class="legend-dot" style="background: #e74c3c;"></span> Selçuklu & Osmanlı</div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 1. MapLibre GL 3D Harita Başlatma - Kesintisiz Yüksek Zoom ve Antik Parşömen Yapılandırması
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          // A. Kesintisiz Topoğrafik Altlık (Esri World Topo Map - Zoom 0..18 tam kapsama, gri kare vermez)
          'esri-topo-source': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            maxzoom: 18,
            attribution: 'Esri, USGS, Kültür Varlıkları ve Müzeler Genel Müdürlüğü'
          },
          // B. Alternatif OpenTopoMap (Konturlar, Nehirler, Yükseklik Çizgileri - Maxzoom: 17 korumalı)
          'opentopo-source': {
            type: 'raster',
            tiles: [
              'https://tile.opentopomap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            maxzoom: 17,
            attribution: 'OpenTopoMap & OSM contributors'
          },
          // C. Alternatif Yüksek Çözünürlüklü 3B Uydu
          'imagery-source': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            maxzoom: 18,
            attribution: 'Esri Satellite & Maxar'
          },
          // D. Alternatif Karanlık Harita
          'dark-source': {
            type: 'raster',
            tiles: [
              'https://a.basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            maxzoom: 18,
            attribution: 'CartoDB Dark Matter'
          },
          // E. Gerçek 3B Yükseklik Modeli (AWS Terrarium DEM - Maxzoom: 15 aşımında otomatik overzoom)
          'terrain-source': {
            type: 'raster-dem',
            tiles: [
              'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'
            ],
            encoding: 'terrarium',
            tileSize: 256,
            maxzoom: 15
          }
        },
        layers: [
          // 0. Antik Deniz / Okyanus Arka Planı (Derin Akdeniz & Ege Mavisi)
          {
            id: 'ocean-base',
            type: 'background',
            paint: {
              'background-color': '#162836'
            }
          },
          // 1. Ana Topoğrafik Zemin Katmanı (Esri World Topo Map)
          {
            id: 'layer-esri-topo',
            type: 'raster',
            source: 'esri-topo-source',
            paint: {
              'raster-contrast': 0.12,
              'raster-saturation': -0.18,
              'raster-brightness-min': 0.05
            }
          },
          // 2. Açık Topoğrafya Katmanı (Başlangıçta gizli)
          {
            id: 'layer-opentopo',
            type: 'raster',
            source: 'opentopo-source',
            layout: { visibility: 'none' },
            paint: {
              'raster-contrast': 0.15,
              'raster-saturation': -0.10
            }
          },
          // 3. Uydu Katmanı (Başlangıçta gizli)
          {
            id: 'layer-imagery',
            type: 'raster',
            source: 'imagery-source',
            layout: { visibility: 'none' },
            paint: { 'raster-contrast': 0.1 }
          },
          // 4. Karanlık Katman (Başlangıçta gizli)
          {
            id: 'layer-dark',
            type: 'raster',
            source: 'dark-source',
            layout: { visibility: 'none' }
          },
          // 5. Antik Sıcak Parşömen & Terracotta Ton Yıkama Katmanı (Sepya / Antik Kağıt Efekti)
          {
            id: 'parchment-sepia-wash',
            type: 'background',
            paint: {
              'background-color': '#2a1e12',
              'background-opacity': 0.22
            }
          },
          // 6. 3B Dağ Gölgelendirme ve Rölyef Kabartması (Hillshade)
          {
            id: 'hills',
            type: 'hillshade',
            source: 'terrain-source',
            layout: { visibility: 'visible' },
            paint: {
              'hillshade-shadow-color': '#180e04',
              'hillshade-highlight-color': '#fcedc7',
              'hillshade-accent-color': '#8c5923',
              'hillshade-exaggeration': 0.85
            }
          }
        ]
      },
      center: [35.2, 39.0], // Anadolu Merkezi
      zoom: 6.2,
      pitch: 55,             // 3 Boyutlu Sinematik Açı
      bearing: -10,
      maxPitch: 85,
      antialias: true
    });

    // Harita Kontrolleri (Pusula, Yakınlaştırma, Tam Ekran)
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
    map.addControl(new maplibregl.FullscreenControl(), 'bottom-right');

    // 2. 3D Terrain ve Atmosfer (Sky & Fog) Yapılandırması
    map.on('load', async () => {
      // 3B Dağlar & Vadiler (1.7x Yükseklik Çarpanı)
      map.setTerrain({ source: 'terrain-source', exaggeration: 1.7 });

      // Antik Sıcak Ufuk Atmosferi (Sky & Mountain Fog)
      if (map.setSky) {
        map.setSky({
          'sky-color': '#14100c',
          'sky-horizon-blend': 0.4,
          'horizon-color': '#4a331c',
          'horizon-fog-blend': 0.7,
          'fog-color': '#2b1c0e',
          'fog-ground-blend': 0.5
        });
      }

      // GeoJSON Verisini Yükle (12.046 Nokta)
      await loadHeritageGeoJSON();
    });

    let rawGeojsonData = null;

    async function loadHeritageGeoJSON() {
      const statusEl = document.getElementById('loading-status');
      try {
        statusEl.innerText = "12.046 TESCİLLİ KÜLTÜR VARLIĞI İNDEKSLENİYOR...";
        const response = await fetch('turkiye_tum_tarihi_yapilar.geojson');
        rawGeojsonData = await response.json();

        document.getElementById('total-heritage-count').innerText = 
          rawGeojsonData.features.length.toLocaleString('tr-TR');

        // MapLibre Kaynağı Olarak Ekle (GPU Destekli Clustering)
        map.addSource('heritage-source', {
          type: 'geojson',
          data: rawGeojsonData,
          cluster: true,
          clusterMaxZoom: 13,
          clusterRadius: 55
        });

        // KÜMELEME KATMANLARI (Antik Bronz ve Mühür Tasarımı)
        // A. Dış Halka (Işıltı & Gölge)
        map.addLayer({
          id: 'clusters-glow',
          type: 'circle',
          source: 'heritage-source',
          filter: ['has', 'point_count'],
          paint: {
            'circle-color': [
              'step', ['get', 'point_count'],
              'rgba(184, 134, 11, 0.4)', 30,
              'rgba(212, 175, 55, 0.5)', 150,
              'rgba(178, 34, 34, 0.6)'
            ],
            'circle-radius': [
              'step', ['get', 'point_count'],
              24, 30,
              30, 150,
              38
            ],
            'circle-blur': 0.3
          }
        });

        // B. Antik Mühür Gövdesi
        map.addLayer({
          id: 'clusters',
          type: 'circle',
          source: 'heritage-source',
          filter: ['has', 'point_count'],
          paint: {
            'circle-color': [
              'step', ['get', 'point_count'],
              '#b8860b', 30, // Bronz Mühür (< 30)
              '#d4af37', 150, // Antik Altın Mühür (30 - 150)
              '#8b1a1a'       // İmparatorluk Kırmızısı (> 150)
            ],
            'circle-radius': [
              'step', ['get', 'point_count'],
              18, 30,
              24, 150,
              30
            ],
            'circle-stroke-width': 2.5,
            'circle-stroke-color': '#fff2cc'
          }
        });

        // C. Mühür Sayı Metni (Tipografi)
        map.addLayer({
          id: 'cluster-count',
          type: 'symbol',
          source: 'heritage-source',
          filter: ['has', 'point_count'],
          layout: {
            'text-field': '{point_count_abbreviated}',
            'text-font': ['Open Sans Bold'],
            'text-size': 13
          },
          paint: {
            'text-color': '#ffffff'
          }
        });

        // TEKİL NOKTALAR (Döneme Göre Renk Kodlu Işıltılı Antik Taşlar)
        map.addLayer({
          id: 'unclustered-point',
          type: 'circle',
          source: 'heritage-source',
          filter: ['!', ['has', 'point_count']],
          paint: {
            'circle-radius': [
              'interpolate', ['linear'], ['zoom'],
              7, 4.5,
              12, 8,
              16, 12
            ],
            'circle-color': [
              'case',
              ['in', 'Neolitik', ['get', 'period_epoch']], '#2ecc71',
              ['in', 'Hitit', ['get', 'period_epoch']], '#e67e22',
              ['in', 'Tunç', ['get', 'period_epoch']], '#e67e22',
              ['in', 'Helenistik', ['get', 'period_epoch']], '#00e5ff',
              ['in', 'Klasik', ['get', 'period_epoch']], '#00e5ff',
              ['in', 'Roma', ['get', 'period_epoch']], '#f1c40f',
              ['in', 'Bizans', ['get', 'period_epoch']], '#9b59b6',
              ['in', 'Selçuklu', ['get', 'period_epoch']], '#e74c3c',
              ['in', 'Osmanlı', ['get', 'period_epoch']], '#d63031',
              '#ffd700' // Varsayılan Antik Altın
            ],
            'circle-stroke-width': 1.8,
            'circle-stroke-color': '#ffffff'
          }
        });

        // Yükleme Ekranını Kapat
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.style.opacity = '0';
        setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);

      } catch (err) {
        console.error("GeoJSON yükleme hatası:", err);
        statusEl.innerText = "VERİ YÜKLENEMEDİ. LÜTFEN DOSYAYI KONTROL EDİN.";
      }
    }

    // 3. Basemap Katman Değiştirici
    document.getElementById('basemap-style-select').addEventListener('change', (e) => {
      const styleKey = e.target.value;
      const layers = {
        'layer-esri-topo': false,
        'layer-opentopo': false,
        'layer-imagery': false,
        'layer-dark': false
      };

      if (styleKey === 'PARCHMENT_TOPO') {
        layers['layer-esri-topo'] = true;
        map.setPaintProperty('parchment-sepia-wash', 'background-opacity', 0.22);
      } else if (styleKey === 'OPENTOPO') {
        layers['layer-opentopo'] = true;
        map.setPaintProperty('parchment-sepia-wash', 'background-opacity', 0.12);
      } else if (styleKey === 'IMAGERY_3D') {
        layers['layer-imagery'] = true;
        map.setPaintProperty('parchment-sepia-wash', 'background-opacity', 0.0);
      } else if (styleKey === 'DARK_MATTER') {
        layers['layer-dark'] = true;
        map.setPaintProperty('parchment-sepia-wash', 'background-opacity', 0.0);
      }

      for (const [layerId, isVisible] of Object.entries(layers)) {
        if (map.getLayer(layerId)) {
          map.setLayoutProperty(layerId, 'visibility', isVisible ? 'visible' : 'none');
        }
      }
    });

    // 4. Etkileşimler: Kümeye Tıklayınca Yakınlaşma
    map.on('click', 'clusters', async (e) => {
      const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
      const clusterId = features[0].properties.cluster_id;
      const zoom = await map.getSource('heritage-source').getClusterExpansionZoom(clusterId);
      map.easeTo({
        center: features[0].geometry.coordinates,
        zoom: zoom + 0.5,
        duration: 800
      });
    });

    // 5. Tekil Noktaya Tıklayınca Zengin Bilimsel Pop-up (Dış Bağlantısız)
    map.on('click', 'unclustered-point', (e) => {
      const p = e.features[0].properties;
      const coords = e.features[0].geometry.coordinates.slice();

      const popupHtml = `
        <span class="popup-badge">${p.category || 'Tescilli Kültür Mirası'}</span>
        <div class="popup-title">${p.name}</div>
        <div class="popup-row"><b>Dönem / Çağ:</b> <span>${p.period_epoch || 'Belirtilmemiş'}</span></div>
        <div class="popup-row"><b>Tarihleme:</b> <span>${p.approx_dating || 'MÖ / MS'}</span></div>
        <div class="popup-row"><b>Konum:</b> <span>${p.province_district || 'Türkiye'}</span></div>
        <div class="popup-row"><b>Statü:</b> <span>${p.protection_status || 'Tescilli Taşınmaz Varlık'}</span></div>
        <div class="popup-row"><b>WGS84:</b> <span>${coords[1].toFixed(5)}°K, ${coords[0].toFixed(5)}°D</span></div>
        <div class="popup-row"><b>Envanter Ref:</b> <span>${p.source_citation || p.id}</span></div>
      `;

      new maplibregl.Popup({ offset: 12 })
        .setLngLat(coords)
        .setHTML(popupHtml)
        .addTo(map);

      // Kamerayı hedefe hafifçe eğ
      map.easeTo({
        center: coords,
        pitch: Math.max(map.getPitch(), 60),
        duration: 900
      });
    });

    // Cursor Efektleri
    map.on('mouseenter', 'clusters', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'clusters', () => { map.getCanvas().style.cursor = ''; });
    map.on('mouseenter', 'unclustered-point', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'unclustered-point', () => { map.getCanvas().style.cursor = ''; });

    // 6. Filtreleme Fonksiyonu (Dönem & Kategori)
    function applyFilters() {
      if (!rawGeojsonData) return;
      const periodVal = document.getElementById('period-filter').value;
      const catVal = document.getElementById('category-filter').value;

      const filteredFeatures = rawGeojsonData.features.filter(feat => {
        const p = feat.properties;
        const pe = p.period_epoch || "";
        const cat = p.category || "";

        // Dönem Denetimi
        let matchPeriod = (periodVal === "ALL");
        if (periodVal === "NEOLITHIC") matchPeriod = pe.includes("Neolitik") || pe.includes("Kalkolitik");
        else if (periodVal === "BRONZE_HITTITE") matchPeriod = pe.includes("Hitit") || pe.includes("Tunç");
        else if (periodVal === "IRON_CLASSIC") matchPeriod = pe.includes("Demir") || pe.includes("Frig") || pe.includes("Lidya") || pe.includes("Urartu");
        else if (periodVal === "HELLENISTIC_ROMAN") matchPeriod = pe.includes("Helenistik") || pe.includes("Roma") || pe.includes("Klasik");
        else if (periodVal === "BYZANTINE") matchPeriod = pe.includes("Bizans");
        else if (periodVal === "SELJUK") matchPeriod = pe.includes("Selçuklu") || pe.includes("Beylik");
        else if (periodVal === "OTTOMAN") matchPeriod = pe.includes("Osmanlı");

        // Kategori Denetimi
        let matchCategory = (catVal === "ALL") || (cat === catVal);

        return matchPeriod && matchCategory;
      });

      map.getSource('heritage-source').setData({
        type: 'FeatureCollection',
        features: filteredFeatures
      });

      document.getElementById('total-heritage-count').innerText = 
        filteredFeatures.length.toLocaleString('tr-TR');
    }

    document.getElementById('period-filter').addEventListener('change', applyFilters);
    document.getElementById('category-filter').addEventListener('change', applyFilters);

    // 7. Canlı Arama Motoru
    document.getElementById('site-search').addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!rawGeojsonData) return;

      if (term.length === 0) {
        applyFilters();
        return;
      }

      const matched = rawGeojsonData.features.filter(f => {
        const name = (f.properties.name || "").toLowerCase();
        const loc = (f.properties.province_district || "").toLowerCase();
        return name.includes(term) || loc.includes(term);
      });

      map.getSource('heritage-source').setData({
        type: 'FeatureCollection',
        features: matched
      });
      document.getElementById('total-heritage-count').innerText = matched.length.toLocaleString('tr-TR');

      // İlk eşleşen kayda uç
      if (matched.length > 0 && term.length >= 3) {
        const top = matched[0];
        map.flyTo({
          center: top.geometry.coordinates,
          zoom: 14,
          pitch: 65,
          speed: 1.2
        });
      }
    });

    // 8. 3 Boyutlu Sinematik Lokasyon Uçuşları (Camera Fly-To Presets)
    const PRESETS = {
      'NEMRUT': { center: [38.7408, 37.9806], zoom: 14.5, pitch: 75, bearing: 35 },
      'KAPADOKYA': { center: [34.8631, 38.6431], zoom: 13.5, pitch: 72, bearing: -45 },
      'ISTANBUL': { center: [28.9784, 41.0082], zoom: 14.0, pitch: 65, bearing: 42 },
      'EFES': { center: [27.3411, 37.9409], zoom: 14.2, pitch: 68, bearing: -25 },
      'LİKYA': { center: [29.3181, 36.3567], zoom: 13.8, pitch: 74, bearing: 55 },
      'GOBEKLITEPE': { center: [38.9225, 37.2232], zoom: 14.5, pitch: 65, bearing: 20 }
    };

    function flyToPreset(key) {
      const target = PRESETS[key];
      if (target) {
        map.flyTo({
          center: target.center,
          zoom: target.zoom,
          pitch: target.pitch,
          bearing: target.bearing,
          duration: 3500,
          essential: true
        });
      }
    }

    // 9. 3B Eğim Modu Aç/Kapat & Kamera Sıfırlama
    let is3DActive = true;
    function toggle3DPerspective() {
      const btn = document.getElementById('btn-pitch-toggle');
      if (is3DActive) {
        map.easeTo({ pitch: 0, bearing: 0, duration: 800 });
        btn.innerText = "3B Eğim Modu [Kapalı]";
        btn.style.background = "#3a2b1b";
      } else {
        map.easeTo({ pitch: 65, bearing: -15, duration: 800 });
        btn.innerText = "3B Eğim Modu [Açık]";
        btn.style.background = "linear-gradient(135deg, #8b6508, #5c4305)";
      }
      is3DActive = !is3DActive;
    }

    function resetCamera() {
      map.flyTo({
        center: [35.2, 39.0],
        zoom: 6.2,
        pitch: 55,
        bearing: -10,
        duration: 2000
      });
      is3DActive = true;
      document.getElementById('btn-pitch-toggle').innerText = "3B Eğim Modu [Açık]";
    }
  </script>
</body>
</html>
